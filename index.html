<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ABC資産形成コンサルタント 試験対策アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; flex-direction: column; gap: 16px;
      font-family: sans-serif; color: #4A90D9; font-size: 15px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 5px solid #D5E8F8;
      border-top-color: #4A90D9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react":             "https://esm.sh/react@18",
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
      "react-dom/client":  "https://esm.sh/react-dom@18/client",
      "recharts":          "https://esm.sh/recharts@2",
      "lucide-react":      "https://esm.sh/lucide-react@0.460.0"
    }
  }
  </script>
</head>
<body>
  <div id="root">
    <div id="loading">
      <div class="spinner"></div>
      <p>読み込み中...</p>
    </div>
  </div>

  <!-- JSX事前変換済みのESモジュールを直接読み込む -->
  <script type="module" src="./abc-exam-app.js"></script>
</body>
</html>
