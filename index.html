<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ABC資産形成コンサルタント 試験対策アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; flex-direction: column; gap: 16px;
      font-family: sans-serif; color: #4A90D9; font-size: 15px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 5px solid #D5E8F8;
      border-top-color: #4A90D9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error { color: #E74C3C; padding: 24px; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <div class="spinner"></div>
      <p>アプリを読み込み中...</p>
      <p style="font-size:12px;color:#7F8C8D">初回は30秒ほどかかる場合があります</p>
    </div>
  </div>

  <script type="module">
    const ESM = "https://esm.sh";
    const DEPS = {
      "react/jsx-runtime": `${ESM}/react@18/jsx-runtime`,
      "react-dom/client":  `${ESM}/react-dom@18/client`,
      "react":             `${ESM}/react@18`,
      "recharts":          `${ESM}/recharts@2`,
      "lucide-react":      `${ESM}/lucide-react`,
    };

    async function boot() {
      // Babel を esm.sh から読み込む
      const { default: Babel } = await import(`${ESM}/@babel/standalone`);

      // JSX ソースを取得
      const res = await fetch("./abc-exam-app.jsx");
      if (!res.ok) throw new Error(`JSX の取得に失敗: ${res.status}`);
      const src = await res.text();

      // JSX → JS 変換
      const { code } = Babel.transform(src, {
        filename: "app.jsx",
        presets: [["react", { runtime: "automatic" }]],
      });

      // import "xxx" → import "https://esm.sh/xxx" に書き換え
      let rewritten = code;
      for (const [bare, url] of Object.entries(DEPS)) {
        // ダブルクォート・シングルクォート両対応
        rewritten = rewritten
          .replace(new RegExp(`from "${bare.replace("/", "\\/")}"`,"g"), `from "${url}"`)
          .replace(new RegExp(`from '${bare.replace("/", "\\/")}' `, "g"), `from '${url}' `);
      }

      // Blob URL として動的インポート
      const blob = new Blob([rewritten], { type: "application/javascript" });
      const blobUrl = URL.createObjectURL(blob);

      const [{ default: App }, { createRoot }] = await Promise.all([
        import(blobUrl),
        import(`${ESM}/react-dom@18/client`),
      ]);
      URL.revokeObjectURL(blobUrl);

      const { createElement } = await import(`${ESM}/react@18`);
      createRoot(document.getElementById("root")).render(createElement(App));
    }

    boot().catch(err => {
      console.error(err);
      document.getElementById("root").innerHTML =
        `<div id="error">
          <p style="font-size:18px;font-weight:bold;margin-bottom:8px">⚠️ 読み込みエラー</p>
          <p style="font-size:13px">${err.message}</p>
          <p style="font-size:12px;margin-top:12px;color:#7F8C8D">
            ページを再読み込みするか、しばらく待ってからお試しください。
          </p>
        </div>`;
    });
  </script>
</body>
</html>
